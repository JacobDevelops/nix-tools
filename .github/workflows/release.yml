name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-version
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release-sha: ${{ steps.verify.outputs.release-sha }}
      tag: ${{ steps.verify.outputs.tag }}
    env:
      PUBLIC_CACHE: https://releases.nix-tools.jacobdevelops.com
      PUBLIC_KEY: nix-tools-cache-1:L//AlyivgCsAry2QZdCyryq9nrQxi6x0usW4Pwfp7cM=
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Verify version and signed native closures
        id: verify
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: .github/workflows/scripts/verify-release.sh

  release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.release-sha }}
      - name: Create immutable GitHub release
        env:
          CACHE_URL: https://releases.nix-tools.jacobdevelops.com
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.verify.outputs.release-sha }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: .github/workflows/scripts/create-release.sh
