[package]
name = "nix-tools-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autobenches = false

[features]
default = []
# Requires a local Nix daemon and permits builds outside hermetic flake checks.
nix-integration = []

[dependencies]
nix-tools-core = { path = "../nix-tools-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[[bench]]
name = "graph_load"
harness = false

[[test]]
name = "graph_bench"
path = "benches/graph_load.rs"

[[bench]]
name = "graph_capture"
harness = false

[[bench]]
name = "graph_pipe"
harness = false
