[package]
name = "nix-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/JacobDevelops/nix-tools"
publish = false
description = "Reusable flake operations and a reference Nix CLI"
readme = "README.md"

[lib]
name = "nix_tools"
path = "src/lib.rs"

[[bin]]
name = "nix-tools"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.47", features = ["derive"] }
nix-tools-core = { path = "../nix-tools-core" }
nix-tools-engine = { path = "../nix-tools-engine" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
signal-hook.workspace = true

[lints]
workspace = true
